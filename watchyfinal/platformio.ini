[env:esp32-s3-devkitc-1]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ldf_mode = deep

lib_deps =
  sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.4
  bodmer/TFT_eSPI@^2.5.43
  adafruit/RTClib@^2.1.3
  lvgl/lvgl@^8.3.11  
  bblanchon/ArduinoJson@6.21.5

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1  ; <-- Keeps Serial Monitor working
  
  ; --- TFT_eSPI Setup ---
  -D USER_SETUP_LOADED=1         
  -D ST7789_2_DRIVER=1           
  -D TFT_RGB_ORDER=TFT_RGB       
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=280
  
  ; --- Pin Mapping ---
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=9
  -D TFT_RST=8
  -D TFT_BL=7
  -D TFT_MISO=-1                 
  
  ; --- Fonts & Performance ---
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=40000000

  ; --- LVGL Settings ---
  -D LV_CONF_SKIP=1
  -D LV_COLOR_DEPTH=16
  -D LV_COLOR_16_SWAP=1
  -D LV_TICK_CUSTOM=1